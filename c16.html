        body{

        h4{
            color:white;

        }
        h1{

        }
        #parent{
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(3, 250px);
            grid-template-rows:  repeat(3,250px );
            gap: 10px;
        }
        .one{
            position: relative;
        }
        .one img{
            border-radius: 20px;
            height: 100%;
            width: 100%;
            overflow: hidden;
            transition: 1.5s;
            
        }
        #one{
            grid-column: span 3;
        }
        .one img:hover{
            opacity: 0.5;
            object-fit: cover;
        }
        .one .a{
            position: absolute;
            color: white;
        
        }
        .one .tw{
            position: absolute;
            color: white;
        
        }
        .tw{
            bottom: 20px;
            left: 20px;
            opacity: 0;
            transition: 1.5s;
        }
        .one:hover .tw{
            opacity: 1;
        }
        #h{
           top: 10px;
           left: 750px;
           border-radius: 5px;
           opacity: 0;
           background-color: dimgrey;
        }

        top: 10px;

            transition: 1.5s;
        }
        .one:hover .a{
            opacity: 1;
        }
